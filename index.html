<body>
    <div id="root"></div>
    
    <!-- Javascript Files -->
    <script src="/assets/js/plugins.js"></script>
    <script src="/assets/js/designesia.js"></script>
    <!-- Disable WOW.js live MutationObserver to prevent it from hiding elements on SPA navigation -->
    <script>
      // After WOW initializes, stop its MutationObserver to prevent it from
      // re-hiding .wow elements when React re-renders the DOM
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          // Force all .wow elements visible after initial WOW animation pass
          document.querySelectorAll('.wow').forEach(function(el) {
            el.style.visibility = '';
            el.style.animationName = '';
          });
        }, 2000);
      });
    </script>
    <script src="/assets/js/swiper.js"></script>
    <script src="/assets/js/custom-swiper-1.js"></script>
    <script src="/assets/js/custom-swiper-2.js"></script>

</body>
